<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>tester</title>

</head>

<body>
<canvas id="maze"></canvas>

</body>
<script>
//https://weblog.jamisbuck.org/2010/12/27/maze-generation-recursive-backtracking

/**
 *  What we need for the generator
 * 1. grid (2d array)
 * 2. cell object (4 variables north, south, east, west all initilized to one for 
 * each wall to be rendered, and a true false value for if it has been visited)
 * 
 */


class Maze {
    constructor(width, height, seed) {
        this.width = width;
        this.height = height;
        this.seed = seed;
        this.grid;
        this.dx = { "E": 1, "W": -1, "N": 0, "S": 0 }
        this.dy = { "E": 0, "W": 0, "N": -1, "S": 1 }
        this.opposite = { "E": "W", "W": "E", "N": "S", "S": "N" }
    }

    generategrid() {
        let grid = [];
        for (let i = 0; i < this.height; i++) {
            let a = []
            for (let j = 0; j < this.width; j++) {
                a.push({ "N": 1, "S": 1, "E": 1, "W": 1, v: false })
            }
            grid.push(a)
        }

        this.grid = grid;
    }

    //cx and cy repersent starting cell
    generateMaze(cx, cy) {
        let directions = ["E", "W", "N", "S"].sort(() => Math.random() - 0.5);

        directions.forEach((d) => {
            let nx = cx + this.dx[d]
            let ny =  cy + this.dy[d]
            //valid cell
            if(nx>=0 && nx<this.width && ny>=0 &&ny<this.height && !this.grid[ny][nx].v){
                this.grid[ny][nx].v = true;
                this.grid[cy][cx][d]-=1;
                let opposite = this.opposite[d]
                this.grid[ny][nx][opposite]-=1
                this.generateMaze(nx,ny);
            }
        })



    }

    //DONT USE ME ONLY FOR TESTING IF RIGHT
    display(canvasId, cellSize = 20) {
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext("2d");

    canvas.width = this.width * cellSize;
    canvas.height = this.height * cellSize;

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 2;

    const fx = (this.width - 1) * cellSize;
    const fy = (this.height - 1) * cellSize;

    ctx.fillStyle = "red";
    ctx.fillRect(fx + 2, fy + 2, cellSize - 4, cellSize - 4);

    for (let y = 0; y < this.height; y++) {
        for (let x = 0; x < this.width; x++) {
            const cell = this.grid[y][x];
            const px = x * cellSize;
            const py = y * cellSize;

            // draw a wall if the direction value is still 1 (uncarved)
            if (cell.N) {
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(px + cellSize, py);
                ctx.stroke();
            }
            if (cell.S) {
                ctx.beginPath();
                ctx.moveTo(px, py + cellSize);
                ctx.lineTo(px + cellSize, py + cellSize);
                ctx.stroke();
            }
            if (cell.E) {
                ctx.beginPath();
                ctx.moveTo(px + cellSize, py);
                ctx.lineTo(px + cellSize, py + cellSize);
                ctx.stroke();
            }
            if (cell.W) {
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(px, py + cellSize);
                ctx.stroke();
            }
        }
    }
}
}

let p = new Maze(20, 20, 20);
p.generategrid()
console.log(p.grid)
p.generateMaze(0,0)
console.log(p.grid)
p.display("maze", 20);
</script>
</html>
